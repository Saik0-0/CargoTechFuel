<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#092642">
<title>Заправка в рейсе</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#122b47;background:#eef2f6;font-synthesis:none;--navy:#092642;--orange:#ff5b00;--muted:#5f6f7e;--line:#d7dde3;--soft:#f4f7fa}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #496e91;outline-offset:3px}
.app{max-width:480px;margin:0 auto;background:#f8fafc;min-height:100dvh;display:flex;flex-direction:column}.mast{min-height:72px;padding:20px 22px;background:var(--navy);color:#fff;border-bottom:3px solid var(--orange);display:flex;justify-content:space-between;align-items:center;gap:12px}.wordmark{font-size:14px;letter-spacing:2px;font-weight:800}.wordmark span{color:var(--orange)}.tag{font-size:12px;color:#c9d4df}main{padding:22px;flex:1}h1{font-size:29px;line-height:1.15;margin:0 0 18px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.5;margin:10px 0}.small,.muted{font-size:14px;color:var(--muted)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#b53e00;font-weight:700;margin-bottom:10px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;margin:14px 0;box-shadow:0 2px 6px #0c243808}.hero{font-size:42px;font-weight:750;letter-spacing:-1.5px;margin:4px 0 8px}.route{font-size:22px;font-weight:700;margin:6px 0}.bar{height:6px;background:#e3e8ee;border-radius:4px;margin:16px 0 0;overflow:hidden}.bar i{display:block;background:var(--orange);height:100%}.primary,.secondary,.danger{min-height:56px;border:0;border-radius:6px;padding:15px 18px;font-weight:700;width:100%;margin:8px 0;line-height:1.35}.primary{background:var(--orange);color:var(--navy)}.secondary{background:#fff;color:var(--navy);border:1px solid #c7ced6}.danger{background:#fff0ec;color:#a62f13;border:1px solid #eccfc5}.back{background:transparent;border:0;padding:14px 0;min-height:48px;color:var(--muted);text-align:left}.notice{padding:14px 16px;background:#fff7ee;border:1px solid #f1ddc1;border-radius:6px;color:#68440d;font-size:14px;line-height:1.5;margin:14px 0}.error{background:#fff0ed;border-color:#efc2bb;color:#a12c1d}.success{background:#e8f7ee;border-color:#bde3ca;color:#166534}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.45}.row:last-child{border:0}.row span:first-child{color:var(--muted)}.row strong{text-align:right}.station{display:block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;text-align:left;width:100%;margin:12px 0;min-height:100px}.station strong{display:block;font-size:18px;margin:4px 0 9px}.station .price{font-size:22px;font-weight:750;color:var(--navy)}.station .distance{float:right;color:var(--muted);font-size:14px}.recommended{border:2px solid #7199b8;background:#f6faff}.label{display:block;margin:20px 0 8px;font-weight:650}input,select{width:100%;min-height:56px;border:1px solid #b5c0cb;border-radius:6px;background:#fff;color:var(--navy);padding:12px;font-size:18px}input[type=checkbox]{width:26px;min-height:26px;height:26px;flex:none;accent-color:var(--orange)}.check{display:flex;align-items:center;gap:14px;padding:12px 0;min-height:58px;line-height:1.4}.pumps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.pump{min-height:72px;background:#fff;border:1px solid #b5c0cb;border-radius:6px;font-size:20px;font-weight:700}.pump small{display:block;font-size:12px;font-weight:400;margin-top:5px}.pump.selected{border:3px solid var(--orange);background:#fff7f2;color:var(--navy)}.pump:disabled{background:#edf1f5;opacity:.7;font-size:17px}.spread{display:flex;gap:10px}.spread>*{flex:1}.amount{font-size:30px;font-weight:750}.status-icon{width:68px;height:68px;background:#e8f7ee;color:#166534;border-radius:50%;display:grid;place-items:center;font-size:32px;margin:10px 0 22px}.step{color:#b53e00;font-size:13px;font-weight:700;margin-bottom:12px}.progress-note{font-size:22px;font-weight:700;margin:20px 0}details{padding:12px 0;line-height:1.6}summary{min-height:48px;padding:10px 0;cursor:pointer}.foot{padding:14px 22px 24px;background:#fff;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.sticky{position:sticky;bottom:0;background:#fff;padding:8px 0 0}.empty{padding:25px 0}#banner:empty{display:none}#banner{margin:0 22px}#alert:empty{display:none}#alert{margin-bottom:18px}button small{font-weight:400}.section-break{border:0;border-top:1px solid var(--line);margin:24px 0}.badge{font-size:12px;font-weight:700;color:#244e73}a{color:#214e76}@media(min-width:600px){.app{margin:26px auto;border:1px solid var(--line);border-radius:10px;overflow:clip;min-height:900px;box-shadow:0 8px 28px #0c243810}}@media(prefers-reduced-motion:no-preference){.primary:active,.station:active{transform:translateY(1px)}}
.row strong{min-width:0;overflow-wrap:anywhere}.row span{min-width:0}
</style>
</head>
<body>
<div class="app">
  <header class="mast"><div class="wordmark">CARGO<span>TECH</span></div><span class="tag">Сервис заправки</span></header>
  <div id="banner" role="status" aria-live="polite"></div>
  <main id="app" aria-busy="true"><h1>Заправка в рейсе</h1><p>Проверяем рейс и незавершённые заправки…</p></main>
  <footer class="foot">Прототип · демонстрационные данные<br>Пользуйтесь приложением после остановки автомобиля</footer>
</div>
<script src="fake-api.js"></script>
<script src="app.js"></script>
</body>
</html>
