<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fc6500">
<title>Заправка в рейсе</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17201d;background:#e9ece9;font-synthesis:none;--orange:#c54b00;--muted:#58655f;--line:#dce2dc;--soft:#f2f5ef}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #126d91;outline-offset:3px}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100dvh;display:flex;flex-direction:column}.mast{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.wordmark{font-size:14px;letter-spacing:1.5px;font-weight:850}.wordmark span{color:var(--orange)}.tag{font-size:12px;color:var(--muted)}main{padding:22px;flex:1}h1{font-size:29px;line-height:1.15;margin:0 0 18px;letter-spacing:-.7px}h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.5;margin:10px 0}.small,.muted{font-size:14px;color:var(--muted)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px}.card{background:var(--soft);border-radius:18px;padding:20px;margin:14px 0}.hero{font-size:42px;font-weight:750;letter-spacing:-1.5px;margin:4px 0 8px}.route{font-size:22px;font-weight:700;margin:6px 0}.bar{height:6px;background:#d9e0d6;border-radius:8px;margin:16px 0 0;overflow:hidden}.bar i{display:block;background:var(--orange);height:100%}.primary,.secondary,.danger{min-height:56px;border:0;border-radius:14px;padding:15px 18px;font-weight:700;width:100%;margin:8px 0;line-height:1.35}.primary{background:var(--orange);color:#fff}.secondary{background:var(--soft);color:#17201d;border:1px solid var(--line)}.danger{background:#fff0ec;color:#a62f13;border:1px solid #eccfc5}.back{background:transparent;border:0;padding:14px 0;min-height:48px;color:var(--muted);text-align:left}.notice{padding:14px 16px;background:#fff3de;border-radius:12px;color:#68440d;font-size:14px;line-height:1.5;margin:14px 0}.error{background:#ffede8;color:#8c2513}.success{background:#ebf6ed;color:#225e31}.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);line-height:1.45}.row:last-child{border:0}.row span:first-child{color:var(--muted)}.row strong{text-align:right}.station{display:block;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left;width:100%;margin:12px 0;min-height:100px}.station strong{display:block;font-size:18px;margin:4px 0 9px}.station .price{font-size:22px;font-weight:750;color:#17201d}.station .distance{float:right;color:var(--muted);font-size:14px}.recommended{border:2px solid #8aaf8c}.label{display:block;margin:20px 0 8px;font-weight:650}input,select{width:100%;min-height:56px;border:1px solid #849389;border-radius:12px;background:#fff;color:#17201d;padding:12px;font-size:18px}input[type=checkbox]{width:26px;min-height:26px;height:26px;flex:none;accent-color:var(--orange)}.check{display:flex;align-items:center;gap:14px;padding:12px 0;min-height:58px;line-height:1.4}.pumps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.pump{min-height:72px;background:#fff;border:1px solid #a5b0a7;border-radius:12px;font-size:20px;font-weight:700}.pump small{display:block;font-size:12px;font-weight:400;margin-top:5px}.pump.selected{border:3px solid var(--orange);background:#fff2e9}.pump:disabled{background:#f0f1ef;opacity:.7;font-size:17px}.spread{display:flex;gap:10px}.spread>*{flex:1}.amount{font-size:30px;font-weight:750}.status-icon{width:68px;height:68px;background:#e3efdf;color:#32623a;border-radius:50%;display:grid;place-items:center;font-size:32px;margin:10px 0 22px}.step{color:var(--orange);font-size:13px;font-weight:700;margin-bottom:12px}.progress-note{font-size:22px;font-weight:700;margin:20px 0}details{padding:12px 0;line-height:1.6}summary{min-height:48px;padding:10px 0;cursor:pointer}.foot{padding:14px 22px 24px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}.sticky{position:sticky;bottom:0;background:#fff;padding:8px 0 0}.empty{padding:25px 0}#banner:empty{display:none}#banner{margin:0 22px}#alert:empty{display:none}#alert{margin-bottom:18px}button small{font-weight:400}.section-break{border:0;border-top:1px solid var(--line);margin:24px 0}.badge{font-size:12px;font-weight:700;color:#32623a}a{color:#944000}@media(min-width:600px){.app{margin:26px auto;border-radius:24px;overflow:clip;min-height:900px;box-shadow:0 15px 60px #233a2112}}@media(prefers-reduced-motion:no-preference){.primary:active,.station:active{transform:translateY(1px)}}
</style>
</head>
<body>
<div class="app">
  <header class="mast"><div class="wordmark">CARGO<span>TECH</span></div><span class="tag">Сервис заправки</span></header>
  <div id="banner" role="status" aria-live="polite"></div>
  <main id="app" aria-busy="true"><h1>Заправка в рейсе</h1><p>Проверяем рейс и незавершённые заправки…</p></main>
  <footer class="foot">Прототип · данные учебного API<br>Пользуйтесь приложением после остановки автомобиля</footer>
</div>
<script src="fake-api.js"></script>
<script src="app.js"></script>
</body>
</html>
